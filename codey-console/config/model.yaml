# codey-console 默认模型配置。
# 可通过命令行参数覆盖其中任意项。
provider: http
endpoint: "https://api.deepseek.com/chat/completions"
modelName: "deepseek-v4-pro"
# 本地调试请通过环境变量注入，避免把真实密钥提交到仓库。
apiKey: ""
apiKeyEnv: _MODEL_API_KEY
temperature: 0.2
debugEnabled: false
debugDir: sessions/model-debug
connectTimeoutMillis: 10000
readTimeoutMillis: 90000  # 90s：并行工具调用时模型需处理多个结果，避免 Read timed out
maxRetries: 2
