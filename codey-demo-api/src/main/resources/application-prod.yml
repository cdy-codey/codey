server:
  port: 18080

spring:
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

upload:
  directory: ./uploads

# 远程采购目录查询服务配置
target-information:
  # TODO: 请填写实际的线上服务地址，例如 https://catalog.example.com
  service-url: ""
  # 远程接口鉴权 Key（生产环境建议通过环境变量覆盖）
  api-key: "4d1ed3fff459b0bac50d5c03d69dab4a12f2148b9c0ff01c"

codey:
  model:
    provider: http
    endpoint: https://api.deepseek.com/chat/completions
    model-name: deepseek-v4-pro
    # 默认空值，dev 环境在 application-dev.yml 中覆盖（不纳入版本控制）
    api-key: ""
    temperature: 0.2
    connect-timeout-millis: 10000
    read-timeout-millis: 30000
    max-retries: 1
    max-tokens: 8192
