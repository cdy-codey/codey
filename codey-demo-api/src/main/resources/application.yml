server:
  port: 18080

codey:
  model:
    # Web Demo 当前直接走 HTTP 模型网关。
    provider: http
    endpoint: https://api.deepseek.com/chat/completions
    model-name: deepseek-v4-pro
    # 当前联调显式指定 key，避免受本机环境变量缺失影响。
    api-key: "sk-d24de3ac58ed46fe901e89caf5c92ec4"
    temperature: 0.2
    connect-timeout-millis: 10000
    read-timeout-millis: 30000
    max-retries: 2
  # 工作目录。
  working-directory: ./workspace/
  # 会话日志。
  session-directory: ./logs/
